      <circle cx="520" cy="132" r="2.6" fill="#C4B5FD"/>
    </g>
    
    
    <g fill="none" stroke-linecap="square">
      <path d="M48 168 H150 L190 128 H280" stroke="#164E63" stroke-width="1.2"/>
