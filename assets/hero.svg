<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Cristiano Vieira — Engenheiro de Software Sênior</title>
  <desc id="desc">Perfil 2026. Mobile, Web e Full Stack. Construa. Inove. Escale. Disponível para novas oportunidades.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F8FAFC" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#080B14" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#132033" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1040" height="600" rx="24"/></clipPath>
    <style><![CDATA[

text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.spin, .spin-rev, .drift, .sweep, .trace, .pulse, .caret, .ln {
  transform-box: fill-box;
  transform-origin: center;
}
.sweep, .trace { transform-box: view-box; }
.spin { animation: spin 28s linear infinite; }
.spin-rev { animation: spin 42s linear infinite reverse; }
.drift { animation: drift 12s ease-in-out infinite; }
.sweep { animation: sweep 9.5s ease-in-out infinite; }
.trace { stroke-dasharray: 36 220; animation: travel 8s linear infinite; }
.pulse { animation: pulse 2.8s ease-in-out infinite; }
.caret { animation: blink 1.15s steps(1, end) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift {
  0%, 100% { transform: translateY(0); opacity: .28; }
  50% { transform: translateY(-12px); opacity: .9; }
}
@keyframes sweep {
  0% { transform: translateX(0); }
  62%, 100% { transform: translateX(1500px); }
}
@keyframes travel { to { stroke-dashoffset: -512; } }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .motion { animation: none !important; }
}


    ]]></style>
  </defs>
  
    
    <g clip-path="url(#frame)">
      <rect width="1040" height="600" fill="#080B14"/>
      <rect width="1040" height="600" fill="url(#grid)" opacity="0.55"/>
      <rect width="1040" height="600" fill="url(#aura)"/>
      <rect width="1040" height="120" fill="url(#sheen)"/>
      <rect class="motion sweep" x="-220" y="0" width="160" height="600" fill="url(#sweepGrad)" opacity="0.28"/>
    </g>
    <rect x="1" y="1" width="1038" height="598" rx="24" fill="none" stroke="#16304A"/>
    <rect x="10" y="10" width="1020" height="580" rx="18" fill="none" stroke="url(#accent)" stroke-opacity="0.35" class="motion trace"/>
    
    
    <path d="M28 50 V28 H50" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="1.4" fill="none"/>
    <path d="M990 28 H1012 V50" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="1.4" fill="none"/>
    <path d="M28 550 V572 H50" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="1.4" fill="none"/>
    <path d="M1012 550 V572 H990" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="1.4" fill="none"/>
    
    
    <g class="motion spin">
