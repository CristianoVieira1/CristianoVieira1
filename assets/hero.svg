      <path d="M992 430 H890 L850 470 H760" stroke="#164E63" stroke-width="1.2"/>
      <path d="M944 552 V470 L908 434 V360" stroke="#164E63" stroke-width="1.2"/>
      <path class="motion trace" d="M48 168 H150 L190 128 H280" stroke="#22D3EE" stroke-width="1.4"/>
      <path class="motion trace" d="M992 430 H890 L850 470 H760" stroke="#8B5CF6" stroke-width="1.4"/>
    </g>
    <path d="M168 154 V166 M162 160 H174" stroke="#38BDF8" stroke-opacity="0.45" fill="none"/>
    <path d="M860 214 V226 M854 220 H866" stroke="#22D3EE" stroke-opacity="0.4" fill="none"/>
    <path d="M210 470 V482 M204 476 H216" stroke="#8B5CF6" stroke-opacity="0.45" fill="none"/>
    
    <circle class="motion drift" cx="120" cy="150" r="1.40" fill="#22D3EE" style="animation-duration:10.0s; animation-delay:-0.0s"/>
<circle class="motion drift" cx="210" cy="430" r="1.85" fill="#8B5CF6" style="animation-duration:11.6s; animation-delay:-2.0s"/>
<circle class="motion drift" cx="860" cy="120" r="2.30" fill="#38BDF8" style="animation-duration:13.2s; animation-delay:-1.0s"/>
<circle class="motion drift" cx="930" cy="360" r="1.40" fill="#22D3EE" style="animation-duration:14.8s; animation-delay:-3.0s"/>
<circle class="motion drift" cx="640" cy="96" r="1.85" fill="#C4B5FD" style="animation-duration:16.4s; animation-delay:-1.4s"/>
<circle class="motion drift" cx="300" cy="520" r="2.30" fill="#38BDF8" style="animation-duration:10.0s; animation-delay:-2.6s"/>
<circle class="motion drift" cx="80" cy="320" r="1.40" fill="#22D3EE" style="animation-duration:11.6s; animation-delay:-4.0s"/>
<circle class="motion drift" cx="980" cy="230" r="1.85" fill="#8B5CF6" style="animation-duration:13.2s; animation-delay:-0.8s"/>
<circle class="motion drift" cx="470" cy="520" r="2.30" fill="#67E8F9" style="animation-duration:14.8s; animation-delay:-3.2s"/>
<circle class="motion drift" cx="760" cy="500" r="1.40" fill="#38BDF8" style="animation-duration:16.4s; animation-delay:-1.8s"/>
<circle class="motion drift" cx="390" cy="120" r="1.85" fill="#22D3EE" style="animation-duration:10.0s; animation-delay:-2.2s"/>
<circle class="motion drift" cx="700" cy="430" r="2.30" fill="#8B5CF6" style="animation-duration:11.6s; animation-delay:-4.4s"/>
    <text x="48" y="58" fill="#94A3B8" font-size="13" letter-spacing="3.2">PERFIL</text>
    <text x="992" y="58" text-anchor="end" fill="#38BDF8" font-size="13" letter-spacing="2.4">2026</text>
    <text x="520" y="214" text-anchor="middle" fill="#38BDF8" font-size="54" font-weight="700" letter-spacing="1.5" filter="url(#soft)" opacity="0.45">CRISTIANO VIEIRA</text>
    <text x="520" y="214" text-anchor="middle" fill="#F8FAFC" font-size="54" font-weight="700" letter-spacing="1.5">CRISTIANO VIEIRA</text>
    <text x="520" y="268" text-anchor="middle" fill="#7DD3FC" font-size="24" letter-spacing="0.4">Engenheiro de Software Sênior</text>
