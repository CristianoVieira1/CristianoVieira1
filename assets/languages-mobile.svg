<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="424" viewBox="0 0 400 424" role="img" aria-labelledby="title desc">
  <title id="title">Linguagens detectadas nos repositórios públicos, por bytes de código</title>
  <desc id="desc">Java 17%, TypeScript 16%, Dart 15%, CSS 11%, PHP 8%, SCSS 8%</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#132033" stroke-width="1"/>
    </pattern>
    <clipPath id="panel"><rect width="400" height="424" rx="20"/></clipPath>
    <style><![CDATA[
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    ]]></style>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="400" height="424" fill="#080B14"/>
    <rect width="400" height="424" fill="url(#grid)" opacity="0.4"/>
    <rect x="28" y="0" width="344" height="2" fill="url(#accent)" opacity="0.9"/>
    <text x="24" y="34" fill="#22D3EE" font-size="12" letter-spacing="1.6">CÓDIGO PÚBLICO</text>
<text x="24" y="68" fill="#F8FAFC" font-size="16" font-weight="700">Java</text>
<text x="376" y="68" text-anchor="end" fill="#94A3B8" font-size="14">17%</text>
<rect x="24" y="78" width="352" height="7" rx="3.5" fill="#10182A"/>
<rect x="24" y="78" width="352.0" height="7" rx="3.5" fill="url(#accent)"/>
<text x="24" y="126" fill="#F8FAFC" font-size="16" font-weight="700">TypeScript</text>
<text x="376" y="126" text-anchor="end" fill="#94A3B8" font-size="14">16%</text>
<rect x="24" y="136" width="352" height="7" rx="3.5" fill="#10182A"/>
<rect x="24" y="136" width="332.3" height="7" rx="3.5" fill="url(#accent)"/>
<text x="24" y="184" fill="#F8FAFC" font-size="16" font-weight="700">Dart</text>
<text x="376" y="184" text-anchor="end" fill="#94A3B8" font-size="14">15%</text>
<rect x="24" y="194" width="352" height="7" rx="3.5" fill="#10182A"/>
<rect x="24" y="194" width="323.1" height="7" rx="3.5" fill="url(#accent)"/>
<text x="24" y="242" fill="#F8FAFC" font-size="16" font-weight="700">CSS</text>
<text x="376" y="242" text-anchor="end" fill="#94A3B8" font-size="14">11%</text>
<rect x="24" y="252" width="352" height="7" rx="3.5" fill="#10182A"/>
<rect x="24" y="252" width="234.0" height="7" rx="3.5" fill="url(#accent)"/>
<text x="24" y="300" fill="#F8FAFC" font-size="16" font-weight="700">PHP</text>
<text x="376" y="300" text-anchor="end" fill="#94A3B8" font-size="14">8%</text>
<rect x="24" y="310" width="352" height="7" rx="3.5" fill="#10182A"/>
<rect x="24" y="310" width="180.4" height="7" rx="3.5" fill="url(#accent)"/>
<text x="24" y="358" fill="#F8FAFC" font-size="16" font-weight="700">SCSS</text>
<text x="376" y="358" text-anchor="end" fill="#94A3B8" font-size="14">8%</text>
<rect x="24" y="368" width="352" height="7" rx="3.5" fill="#10182A"/>
<rect x="24" y="368" width="169.1" height="7" rx="3.5" fill="url(#accent)"/>
  </g>
  <rect x="0.75" y="0.75" width="398.5" height="422.5" rx="20" fill="none" stroke="#16304A"/>
