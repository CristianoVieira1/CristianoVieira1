<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Linguagens detectadas nos repositórios públicos, por bytes de código</title>
  <desc id="desc">Java 17%, TypeScript 16%, Dart 15%, CSS 11%, PHP 8%, SCSS 8%</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#132033" stroke-width="1"/>
    </pattern>
    <clipPath id="panel"><rect width="900" height="300" rx="20"/></clipPath>
    <style><![CDATA[
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    ]]></style>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="900" height="300" fill="#080B14"/>
    <rect width="900" height="300" fill="url(#grid)" opacity="0.4"/>
    <rect x="28" y="0" width="844" height="2" fill="url(#accent)" opacity="0.9"/>
    <text x="32" y="42" fill="#22D3EE" font-size="12" letter-spacing="1.6">REPOSITÓRIOS PÚBLICOS</text>
<text x="868" y="42" text-anchor="end" fill="#64748B" font-size="12">EM BYTES</text>
<text x="32" y="86" fill="#F8FAFC" font-size="16">Java</text>
<rect x="210" y="74" width="520" height="8" rx="4" fill="#10182A"/>
<rect x="210" y="74" width="520.0" height="8" rx="4" fill="url(#accent)"/>
<text x="868" y="86" text-anchor="end" fill="#94A3B8" font-size="14">17%</text>
<text x="32" y="122" fill="#F8FAFC" font-size="16">TypeScript</text>
<rect x="210" y="110" width="520" height="8" rx="4" fill="#10182A"/>
<rect x="210" y="110" width="490.8" height="8" rx="4" fill="url(#accent)"/>
<text x="868" y="122" text-anchor="end" fill="#94A3B8" font-size="14">16%</text>
<text x="32" y="158" fill="#F8FAFC" font-size="16">Dart</text>
<rect x="210" y="146" width="520" height="8" rx="4" fill="#10182A"/>
<rect x="210" y="146" width="477.3" height="8" rx="4" fill="url(#accent)"/>
<text x="868" y="158" text-anchor="end" fill="#94A3B8" font-size="14">15%</text>
<text x="32" y="194" fill="#F8FAFC" font-size="16">CSS</text>
<rect x="210" y="182" width="520" height="8" rx="4" fill="#10182A"/>
<rect x="210" y="182" width="345.6" height="8" rx="4" fill="url(#accent)"/>
<text x="868" y="194" text-anchor="end" fill="#94A3B8" font-size="14">11%</text>
<text x="32" y="230" fill="#F8FAFC" font-size="16">PHP</text>
<rect x="210" y="218" width="520" height="8" rx="4" fill="#10182A"/>
<rect x="210" y="218" width="266.5" height="8" rx="4" fill="url(#accent)"/>
<text x="868" y="230" text-anchor="end" fill="#94A3B8" font-size="14">8%</text>
<text x="32" y="266" fill="#F8FAFC" font-size="16">SCSS</text>
<rect x="210" y="254" width="520" height="8" rx="4" fill="#10182A"/>
<rect x="210" y="254" width="249.8" height="8" rx="4" fill="url(#accent)"/>
<text x="868" y="266" text-anchor="end" fill="#94A3B8" font-size="14">8%</text>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="20" fill="none" stroke="#16304A"/>
</svg>
