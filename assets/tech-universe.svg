<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Meu universo técnico</title>
  <desc id="desc">Engenharia de software em mobile, frontend, backend, cloud e ferramentas.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F8FAFC" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#080B14" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#132033" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="960" height="640" rx="24"/></clipPath>
    <style><![CDATA[

text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.spin, .spin-rev, .drift, .sweep, .trace, .pulse, .caret, .ln {
  transform-box: fill-box;
  transform-origin: center;
}
.sweep, .trace { transform-box: view-box; }
.spin { animation: spin 28s linear infinite; }
.spin-rev { animation: spin 42s linear infinite reverse; }
.drift { animation: drift 12s ease-in-out infinite; }
.sweep { animation: sweep 9.5s ease-in-out infinite; }
.trace { stroke-dasharray: 36 220; animation: travel 8s linear infinite; }
.pulse { animation: pulse 2.8s ease-in-out infinite; }
.caret { animation: blink 1.15s steps(1, end) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift {
  0%, 100% { transform: translateY(0); opacity: .28; }
  50% { transform: translateY(-12px); opacity: .9; }
}
@keyframes sweep {
  0% { transform: translateX(0); }
  62%, 100% { transform: translateX(1500px); }
}
@keyframes travel { to { stroke-dashoffset: -512; } }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .motion { animation: none !important; }
}


    ]]></style>
  </defs>
  
    
    <g clip-path="url(#frame)">
      <rect width="960" height="640" fill="#080B14"/>
      <rect width="960" height="640" fill="url(#grid)" opacity="0.55"/>
      <rect width="960" height="640" fill="url(#aura)"/>
      <rect width="960" height="120" fill="url(#sheen)"/>
      <rect class="motion sweep" x="-220" y="0" width="160" height="640" fill="url(#sweepGrad)" opacity="0.28"/>
    </g>
    <rect x="1" y="1" width="958" height="638" rx="24" fill="none" stroke="#16304A"/>
    <rect x="10" y="10" width="940" height="620" rx="18" fill="none" stroke="url(#accent)" stroke-opacity="0.35" class="motion trace"/>
    
    <g class="motion spin">
      <circle cx="480" cy="318" r="98" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-dasharray="3 8"/>
      <circle cx="578" cy="318" r="3.2" fill="#22D3EE"/>
    </g>
    <g class="motion spin-rev">
      <circle cx="480" cy="318" r="112" fill="none" stroke="#8B5CF6" stroke-opacity="0.28" stroke-dasharray="2 10"/>
      <circle cx="480" cy="206" r="2.8" fill="#C4B5FD"/>
    </g>
    <path d="M480 248 V192 M480 388 V466 M410 318 H374 M550 318 H586" stroke="#164E63" fill="none"/>
    <rect x="255" y="16" width="450" height="176" rx="16" fill="#0C1222" stroke="#1E3A5F"/><rect x="255" y="16" width="450" height="36" rx="16" fill="url(#sheen)"/><rect x="255" y="34" width="450" height="18" fill="#0C1222"/><text x="277" y="48" fill="#22D3EE" font-size="12" letter-spacing="1.5">ENGENHARIA MOBILE</text><text x="277" y="80" fill="#F8FAFC" font-size="16">React Native</text><text x="277" y="106" fill="#F8FAFC" font-size="16">Expo</text><text x="277" y="132" fill="#F8FAFC" font-size="16">Android</text><text x="277" y="158" fill="#F8FAFC" font-size="16">iOS</text>
    <rect x="586" y="214" width="352" height="208" rx="16" fill="#0C1222" stroke="#1E3A5F"/><rect x="586" y="214" width="352" height="36" rx="16" fill="url(#sheen)"/><rect x="586" y="232" width="352" height="18" fill="#0C1222"/><text x="608" y="246" fill="#22D3EE" font-size="12" letter-spacing="1.5">ENGENHARIA FRONTEND</text><text x="608" y="278" fill="#F8FAFC" font-size="16">React</text><text x="608" y="304" fill="#F8FAFC" font-size="16">Next.js</text><text x="608" y="330" fill="#F8FAFC" font-size="16">Angular</text><text x="608" y="356" fill="#F8FAFC" font-size="16">TypeScript</text>
    <rect x="255" y="466" width="450" height="150" rx="16" fill="#0C1222" stroke="#1E3A5F"/><rect x="255" y="466" width="450" height="36" rx="16" fill="url(#sheen)"/><rect x="255" y="484" width="450" height="18" fill="#0C1222"/><text x="277" y="498" fill="#22D3EE" font-size="12" letter-spacing="1.5">BACKEND E CLOUD</text><text x="277" y="530" fill="#F8FAFC" font-size="16">Node.js</text><text x="277" y="556" fill="#F8FAFC" font-size="16">Firebase</text><text x="277" y="582" fill="#F8FAFC" font-size="16">APIs REST</text>
    <rect x="22" y="203" width="352" height="230" rx="16" fill="#0C1222" stroke="#1E3A5F"/><rect x="22" y="203" width="352" height="36" rx="16" fill="url(#sheen)"/><rect x="22" y="221" width="352" height="18" fill="#0C1222"/><text x="44" y="235" fill="#22D3EE" font-size="12" letter-spacing="1.5">FERRAMENTAS</text><text x="44" y="267" fill="#F8FAFC" font-size="16">Git</text><text x="44" y="293" fill="#F8FAFC" font-size="16">GitHub</text><text x="44" y="319" fill="#F8FAFC" font-size="16">VS Code</text><text x="44" y="345" fill="#F8FAFC" font-size="16">Xcode</text><text x="44" y="371" fill="#F8FAFC" font-size="16">Android Studio</text>
    <circle cx="480" cy="318" r="70" fill="#080B14" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="480" y="310" text-anchor="middle" fill="#94A3B8" font-size="11" letter-spacing="1.2">ENGENHARIA</text>
    <text x="480" y="330" text-anchor="middle" fill="#F8FAFC" font-size="12" letter-spacing="0.6">DE SOFTWARE</text>
    
</svg>
