name: Atualizar cobrinha de contribuições

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gerar versões clara e escura
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: CristianoVieira1
          outputs: |
            assets/snake-light.svg?color_snake=#087D82&color_dots=#E8F0F0,#B8E4E5,#7DD0D2,#39B8BC,#087D82
            assets/snake-dark.svg?color_snake=#1DB3B8&color_dots=#10252C,#16464C,#1A6970,#198E94,#1DB3B8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Criar alternativas sem movimento
        run: python3 .github/scripts/freeze_snake.py
      - name: Publicar apenas a animação e suas alternativas
        run: |
          git add assets/snake-dark.svg assets/snake-light.svg assets/snake-static-dark.svg assets/snake-static-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update contribution animation'
          git push
