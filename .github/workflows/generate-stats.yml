name: Refresh public activity

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild activity, language, and contribution graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_activity.py

      - name: Commit refreshed graphics
        run: |
          git add assets/activity-metrics.svg assets/activity-metrics-mobile.svg assets/languages.svg assets/languages-mobile.svg assets/contribution-grid.svg .github/scripts/language-cache.json README.md
          if git diff --cached --quiet; then
            echo "Activity unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public GitHub activity"
          git push
