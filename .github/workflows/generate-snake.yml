name: Generate contribution snake

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the snake from the public contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#8B5CF6&color_dots=#10182A,#155E75,#0891B2,#38BDF8,#C4B5FD

      - name: Commit the updated snake
        run: |
          git add assets/snake.svg
          if git diff --cached --quiet; then
            echo "Snake unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contribution snake"
          git push
